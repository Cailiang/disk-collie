[package]
name = "disk-collie-engine"
version = "1.0.30"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
blake3 = "1.8"
sysinfo = "0.33"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
blake3 = { version = "1.8", features = ["pure"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

